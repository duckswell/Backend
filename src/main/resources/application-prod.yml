spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini

weather:
  api-key: ${WEATHER_API_KEY}

aws:
  region: ap-northeast-2
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: duckswell-bucket

# [AI 사진 분석 기능 - python venv/스크립트]
# Docker 이미지 빌드 시점에 duckswellAI의 필요한 4개 항목(src/features/, scripts/analyze.py,
# scripts/check_photo.py, models_export.json)과 venv(requirements.txt 기반)가 이미
# /opt/app/ai, /opt/venv 아래에 구워져 있다(Dockerfile 참고) - 서버에서 따로 설치/복사할 게 없다.
# 아래 두 값은 이미지에 이미 그 경로로 기본값이 박혀있어서, 특별히 다른 경로를 쓰고 싶은 게
# 아니면 .env.prod에도 그대로(같은 값으로) 채워두면 된다.
duckswell-ai:
  python-path: ${DUCKSWELL_AI_PYTHON_PATH:}
  scripts-path: ${DUCKSWELL_AI_SCRIPTS_PATH:}

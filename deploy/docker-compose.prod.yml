services:
  mysql:
    image: mysql:8.0
    container_name: duckswell-mysql
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=128M"]
    mem_limit: 350m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: duckswell
      TZ: Asia/Seoul
    volumes:
      - duckswell-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: naeuun/duckswell:latest
    container_name: duckswell-app
    restart: unless-stopped
    # JVM 힙(Xmx280m) + CV 분석 시 뜨는 Python 서브프로세스(mediapipe/opencv)가 같은 컨테이너
    # 메모리를 나눠 쓰므로, 힙보다 넉넉하게 잡는다 (micro 1GB 기준: mysql 350m + app 600m = 950m,
    # 나머지 ~70m은 OS/nginx/sshd 몫 - 빠듯하니 실사용 트래픽 늘면 재점검 필요).
    mem_limit: 600m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DUCKSWELL_AI_PYTHON_PATH: ${DUCKSWELL_AI_PYTHON_PATH}
      DUCKSWELL_AI_SCRIPTS_PATH: ${DUCKSWELL_AI_SCRIPTS_PATH}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  duckswell-mysql-data:

# /etc/nginx/sites-available/duckswell.conf 로 서버에 배치, sites-enabled에 심볼릭 링크.
# certbot --nginx -d api.hale.site 실행 시 443 서버 블록/인증서 경로는 자동으로 추가/수정됨 -
# 아래는 그 전에 필요한 최소 골격(HTTP -> HTTPS 리다이렉트 + 업스트림 설정).

server {
    listen 80;
    listen [::]:80;
    server_name api.hale.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hale.site;

    # certbot이 아래 두 줄을 실제 인증서 경로로 채워줌
    # ssl_certificate /etc/letsencrypt/live/api.hale.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.hale.site/privkey.pem;

    # 앱의 멀티파트 업로드 제한(25MB)보다 작으면 사진 업로드가 여기서 막힌다 - 잊기 쉬운 포인트.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

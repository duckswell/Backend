# /etc/nginx/sites-available/duckswell.conf 로 서버에 배치.
# 아래는 `sudo certbot --nginx -d api.finhabit.shop --redirect` 실행 "후"의 최종 상태를
# 그대로 복사해둔 것 - 443/리다이렉트 블록은 certbot이 자동으로 추가해준 부분("managed by Certbot").
# 새 서버에 처음 배포할 땐 이 파일을 그대로 쓰지 말고, 80번 포트 블록만 먼저 올린 뒤
# `certbot --nginx -d <도메인> --redirect`를 실행해서 443 블록을 새로 발급받을 것.
#
# 임시 도메인(finhabit.shop)으로 우선 발급 - hale.site 구매 후(8/18~)에는 도메인만 바꿔서
# certbot을 다시 돌리면 나머지 구조는 그대로 재사용 가능.

server {
    server_name api.finhabit.shop;

    # 앱의 멀티파트 업로드 제한(25MB)보다 작으면 사진 업로드가 여기서 막힌다 - 잊기 쉬운 포인트.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.finhabit.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.finhabit.shop/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.finhabit.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.finhabit.shop;
    return 404; # managed by Certbot
}
